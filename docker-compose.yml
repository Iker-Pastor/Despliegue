services:
  backend:
    build: 
      context: ./Backend-Spring-Boot/Bluecrew-api/api
    container_name: spring-api
    networks:
      - app-network
    volumes:
      - uploads_volume:/app/uploads

  angular-frontend:
    build: ./Angular-Admin
    container_name: angular-web
    depends_on:
      - backend
    networks:
      - app-network

  nginx-proxy:
    image: nginx:alpine
    container_name: bluecrew_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_volume:/data/uploads:ro 
    depends_on:
      - angular-frontend
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  uploads_volume: